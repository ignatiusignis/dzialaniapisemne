 if(subMode==='sandbox'){const a=subRead(subRows[0]),b=subRead(subRows[1]);if(a===null||b===null||a<b){$('sub-status').textContent='Wpisz dwie liczby bez pustych miejsc i zer wiodących. Odjemna musi być większa lub równa odjemnikowi.';return}subA=a;subB=b}
 const errors=subValidate(subA,subB,subRows,subResult,subHist,subW);
 if(subMode==='test'){
  subTestItems.push({a:subA,b:subB,w:subW,rows:subRows.map(x=>x.slice()),result:subResult.slice(),hist:subHist.map(x=>x.slice()),errors});
  if(!errors.size)subScore++;subIndex++;if(subIndex<5){subNew();return}subFinishTest();return
 }
 subDraw(errors);$('sub-status').textContent=errors.size?'Sprawdź czerwone kratki.':'Brawo! Poprawne działanie.';
 if(!errors.size&&!['sandbox','learn'].includes(subMode)){subScore++;subLocked=true;$('sub-check').disabled=true}
}
function subFinishTest(){
 subLocked=true;$('sub-check').disabled=true;$('sub-next').hidden=false;$('sub-next').textContent='Kolejna kartkówka';$('sub-progress').textContent='Kartkówka zakończona';$('sub-status').textContent='Wynik: '+subScore+' / 5';
 const review=$('sub-review');review.hidden=false;review.replaceChildren();
 for(const [i,t] of subTestItems.entries()){
  const box=document.createElement('div');box.className='test-review-item';const title=document.createElement('h3');title.textContent='Zadanie '+(i+1)+' — '+(t.errors.size?'Do poprawy':'Poprawne');box.append(title);
  const cols=document.createElement('div');cols.className='test-columns';box.append(cols);
  for(const correct of [false,true]){
   const pane=document.createElement('div');pane.className='test-column';const label=document.createElement('h4');label.textContent=correct?'Poprawne rozwiązanie':'Twoje rozwiązanie';pane.append(label);const math=document.createElement('div');math.className='math';const root=document.createElement('div');root.className='column';math.append(root);pane.append(math);cols.append(pane);
   subA=t.a;subB=t.b;subW=t.w;subRows=t.rows;subEditable=new Set(Array.from({length:t.w},(_,p)=>'2:'+p));
   if(correct){const plan=subPlan(t.a,t.b);subHist=plan.hist.map(x=>x.map(String));subResult=Array.from({length:t.w},(_,p)=>p<String(t.a-t.b).length?String(sd(t.a-t.b,p)):'')}else{subHist=t.hist;subResult=t.result}
   subDraw(correct?new Set():t.errors,root,false);
  }review.append(box)
 }
 const t=subTestItems.at(-1);subA=t.a;subB=t.b;subW=t.w;subRows=t.rows;subHist=t.hist;subResult=t.result;subDraw(t.errors,$('sub-grid'),false)
}
$('start').onclick=()=>$('operation').value==='sub'?subStart():startGame();
for(const n of [1,2,3,4,5,6,7,8,9,0]){const b=document.createElement('button');b.textContent=n;b.onclick=()=>subInput(n);$('sub-keys').append(b)}
$('sub-delete').onclick=()=>subInput(null);$('sub-cross').onclick=subCross;$('sub-check').onclick=subCheck;$('sub-next').onclick=()=>{if(subMode==='sandbox'){if(confirm('Wyczyścić działanie?'))subNew();return}if(subMode==='test'||subIndex===10){subStart();return}subIndex++;if(subIndex===10){subLocked=true;$('sub-check').disabled=true;$('sub-status').textContent='Koniec serii. Wynik: '+subScore+' / 10';$('sub-next').textContent='Kolejna seria'}else subNew()};

const oldSubRestart=$('restart').onclick,oldSubOptions=$('pause-options').onclick,oldSubBack=$('options-back').onclick;
$('restart').onclick=()=>{if(screen!=='sub-screen')return oldSubRestart();if(confirm('Rozpocząć od nowa?')){subStart();$('pause-dialog').hidden=true}};
$('pause-options').onclick=()=>{if(screen!=='sub-screen')return oldSubOptions();$('pause-dialog').hidden=true;openOptions('sub-screen')};

document.addEventListener('keydown',e=>{if(screen!=='sub-screen'||!$('pause-dialog').hidden||['SELECT','BUTTON'].includes(e.target.tagName))return;if(/^\d$/.test(e.key))subInput(Number(e.key));else if(['Backspace','Delete'].includes(e.key)){e.preventDefault();subInput(null)}});


const subStageNames=['Bez pożyczania','Pierwsze pożyczanie','Kilka pożyczeń','Pożyczanie przez zero','Pożyczanie przez kilka zer'];
let subDemoPair,subFrames=[],subFrame=0;
function subMakeFrames(a,b,method){
 const w=String(a).length,rows=[a,b].map(n=>Array.from({length:w},(_,p)=>p<String(n).length?String(sd(n,p)):'')),shown=[Array(w).fill(''),Array(w).fill('')],hist=Array.from({length:w},()=>[]),result=Array(w).fill(''),d=Array.from({length:w},(_,p)=>sd(a,p)),frames=[];
 const push=t=>frames.push({rows:shown.map(x=>x.slice()),hist:hist.map(x=>x.slice()),result:result.slice(),t});
 push('Ułóż w słupku: '+a+' − '+b+'. Jedności pod jednościami.');
 for(let j=0;j<2;j++)for(let p=String(j?b:a).length-1;p>=0;p--){shown[j][p]=rows[j][p];push('Wpisz cyfrę '+rows[j][p]+' w odpowiedniej kolumnie.')}
 for(let p=0;p<w;p++){
  const v=sd(b,p);
  if(d[p]<v){
   push(d[p]+' jest mniejsze od '+v+'. Musimy pożyczyć z lewej strony.');
   let q=p+1;while(q<w&&d[q]===0)q++;
   d[q]--;hist[q].push(String(d[q]));push('Skreśl cyfrę w kolumnie '+(q+1)+' od prawej. Zostaje '+d[q]+'.');
   for(let k=q-1;k>p;k--){if(method==='step'){hist[k].push('10');push('Zero otrzymuje 10 z lewej strony.')}hist[k].push('9');d[k]=9;push(method==='step'?'Skreśl 10 i zapisz 9. Pożyczamy dalej.':'Zapisz 9 nad zerem: otrzymujemy 10 i oddajemy 1 dalej.')}
   d[p]+=10;hist[p].push(String(d[p]));push('Do tej kolumny dodajemy 10. Otrzymujemy '+d[p]+'.');
  }
  const n=d[p]-v;result[p]=p<String(a-b).length?String(n):'';push(d[p]+' − '+v+' = '+n+'. '+(result[p]===''?'Nie zapisujemy zera wiodącego.':'Zapisz '+n+' w wyniku.'));
 }
 push('Gotowe! '+a+' − '+b+' = '+(a-b)+'. Teraz spróbuj samodzielnie.');return frames;
}
function subBuildDemo(){subFrames=subMakeFrames(...subDemoPair,'step');subFrame=0;subDemoDraw()}
function subDemoDraw(){
 const f=subFrames[subFrame],saved=[subW,subRows,subHist,subResult,subEditable];try{subW=String(subDemoPair[0]).length;subRows=f.rows;subHist=f.hist;subResult=f.result;subEditable=new Set();subDraw(null,$('sub-demo'),false)}finally{[subW,subRows,subHist,subResult,subEditable]=saved}
 $('sub-explain').textContent=f.t;$('sub-prev').disabled=subFrame===0;$('sub-forward').disabled=subFrame===subFrames.length-1;
}
$('sub-prev').onclick=()=>{subFrame=Math.max(0,subFrame-1);subDemoDraw()};$('sub-forward').onclick=()=>{subFrame=Math.min(subFrames.length-1,subFrame+1);subDemoDraw()};$('sub-reset').onclick=()=>{if(confirm('Pokazać demonstrację od początku?')){subFrame=0;subDemoDraw()}};
$('sub-easier').onclick=()=>{subLevel=Math.max(1,subLevel-1);subNew()};$('sub-similar').onclick=subNew;$('sub-harder').onclick=()=>{subLevel=Math.min(5,subLevel+1);subNew()};


function mulPlan(a,b){
 const ad=String(a).length,bd=String(b).length,w=String(a*b).length,parts=[],carries=[];
 for(let j=0;j<bd;j++){const digit=sd(b,j),p=Array(w).fill(''),c=Array(w).fill('');let carry=0;
 for(let k=0;k<ad;k++){const t=sd(a,k)*digit+carry;p[k+j]=String(t%10);carry=Math.floor(t/10);if(carry&&k+1<ad)c[k+1]=String(carry)}
 if(carry)p[ad+j]=String(carry);
 // Zero partial products are represented by a single zero.
 for(let k=w-1;k>j;k--){if(p[k]==='0')p[k]='';else if(p[k]!=='')break}
 parts.push(p);carries.push(c)}
 const sum=Array(w).fill(''),result=Array.from({length:w},(_,p)=>String(sd(a*b,p)));let carry=0;
 for(let p=0;p<w;p++){const t=parts.reduce((s,row)=>s+Number(row[p]||0),carry);carry=Math.floor(t/10);if(carry&&p+1<w)sum[p+1]=String(carry)}
 return {w,ad,bd,parts,carries,sum,result};
}
function mulGenerate(l){const lens=[[2,1],[3,1],[3,2],[4,3],[5,4]][l-1]||[2,1];return lens.map(n=>Math.floor((1+9*Math.random())*10**(n-1)))}
let mulA,mulB,mulP,mulValues,mulActive,mulRow,mulCarryMode,mulLocked,mulIndex,mulScore,mulLevel;
const mulKey=(r,p)=>r+':'+p;
function mulExpected(){
 const e={};for(let j=0;j<mulP.bd;j++)for(let p=0;p<mulP.w;p++){e[mulKey('p'+j,p)]=mulP.parts[j][p];if(p<mulP.ad)e[mulKey('c'+j,p)]=mulP.carries[j][p]}
 if(mulP.bd>1)for(let p=0;p<mulP.w;p++){e[mulKey('s',p)]=mulP.sum[p];e[mulKey('r',p)]=mulP.result[p]}return e;
}
function mulMatches(k,v,e){if(v===e)return true;const [r,p]=k.split(':');return r.startsWith('p')&&Number(p)<Number(r.slice(1))&&e===''&&v==='0'}
function mulDraw(check=false){
 const root=$('mul-grid'),e=mulExpected();root.replaceChildren();
 function row(kind,sign='',fixed=null,cls=''){
 const el=document.createElement('div');el.className='line '+cls;el.append(cell(sign,'sign'));
 for(let p=mulP.w-1;p>=0;p--){const k=mulKey(kind,p),edit=Object.hasOwn(e,k),v=edit?(mulValues[k]||''):fixed!==null&&p<String(fixed).length?String(sd(fixed,p)):'',d=cell(v,edit?'entry':'');
 if(edit){d.classList.add('mul-target');d.onclick=()=>{if(mulLocked)return;mulActive=k;if(kind.startsWith('p'))mulRow=Number(kind.slice(1));mulDraw()};if(!check&&mulActive===k)d.classList.add('active');if(check&&(v!==''||e[k]!==''))d.classList.add(mulMatches(k,v,e[k])?'right':'wrong')}
 if(kind==='p0'&&mulP.bd>1){const sk=mulKey('s',p),sv=mulValues[sk]||'';if(sv||mulCarryMode||check&&e[sk]){const m=document.createElement('span');m.className='mul-mini';m.textContent=sv;if(check)m.classList.add(sv===e[sk]?'right':'wrong');m.onclick=ev=>{ev.stopPropagation();if(!mulLocked){mulActive=sk;mulCarryMode=true;mulDraw()}};d.append(m)}}
 el.append(d)}root.append(el)}
 const rule=()=>{const d=document.createElement('div');d.className='rule';root.append(d)};
 row('c'+mulRow,'',null,'mul-carry-row');row('a','',mulA);row('b','×',mulB);rule();
 for(let j=0;j<mulP.bd;j++)row('p'+j,j===mulP.bd-1&&j>0?'+':'');
 if(mulP.bd>1){rule();row('r')}
 $('mul-carry').setAttribute('aria-pressed',String(mulCarryMode));$('mul-carry').disabled=mulP.bd===1||mulLocked;
}
function mulNew(){[mulA,mulB]=mulGenerate(mulLevel);mulP=mulPlan(mulA,mulB);mulValues={};mulActive='p0:0';mulRow=0;mulCarryMode=false;mulLocked=false;$('mul-check').disabled=false;$('mul-next').textContent='Nowe zadanie';$('mul-progress').textContent='Zadanie '+(mulIndex+1)+' / 10 · Poprawne: '+mulScore;$('mul-status').textContent='Oblicz iloczyny częściowe. Przeniesienia mnożenia wpisuj nad mnożną. Przy dodawaniu użyj przycisku Dalej.';mulDraw()}
function mulStart(){mulLevel=Number($('level').value);mulIndex=0;mulScore=0;show('mul-screen');mulNew()}
function mulInput(n){if(mulLocked)return;let [r,p]=mulActive.split(':');p=Number(p);if(mulCarryMode){r='s';if(mulP.bd===1)return}const k=mulKey(r,p),e=mulExpected();if(!Object.hasOwn(e,k))return;mulValues[k]=n===null?'':String(n);if(mulCarryMode){mulCarryMode=false;mulActive=mulKey('r',p)}else if(n!==null&&!r.startsWith('c')&&p+1<mulP.w)mulActive=mulKey(r,p+1);$('mul-status').textContent='';mulDraw()}
function mulCheck(){if(mulLocked)return;const e=mulExpected(),ok=Object.keys(e).every(k=>mulMatches(k,mulValues[k]||'',e[k]));mulCarryMode=false;mulDraw(true);$('mul-status').textContent=ok?'Brawo! Poprawne działanie.':'Sprawdź czerwone kratki oraz przeniesienia. Wybierz wiersz iloczynu, aby zobaczyć jego przeniesienia.';if(ok){mulScore++;mulLocked=true;$('mul-check').disabled=true;$('mul-carry').disabled=true}}
const oldMulStart=$('start').onclick;$('start').onclick=()=>$('operation').value==='mul'?mulStart():oldMulStart();
for(const n of [1,2,3,4,5,6,7,8,9,0]){const b=document.createElement('button');b.textContent=n;b.onclick=()=>mulInput(n);$('mul-keys').append(b)}
$('mul-delete').onclick=()=>mulInput(null);$('mul-carry').onclick=()=>{if(mulLocked)return;mulCarryMode=!mulCarryMode;mulDraw()};$('mul-check').onclick=mulCheck;
$('mul-next').onclick=()=>{if(mulIndex===10){mulStart();return}mulIndex++;if(mulIndex===10){mulLocked=true;$('mul-check').disabled=true;$('mul-carry').disabled=true;$('mul-status').textContent='Koniec serii. Wynik: '+mulScore+' / 10';$('mul-next').textContent='Kolejna seria'}else mulNew()};
$('mul-pause').onclick=()=>{$('pause-dialog').hidden=false};
const oldMulRestart=$('restart').onclick,oldMulOptions=$('pause-options').onclick,oldMulBack=$('options-back').onclick;
$('restart').onclick=()=>{if(screen!=='mul-screen')return oldMulRestart();if(confirm('Rozpocząć od nowa?')){mulStart();$('pause-dialog').hidden=true}};
$('pause-options').onclick=()=>{if(screen!=='mul-screen')return oldMulOptions();$('pause-dialog').hidden=true;openOptions('mul-screen')};
$('options-back').onclick=()=>{oldMulBack();if(screen==='mul-screen')$('pause-dialog').hidden=false};
document.addEventListener('keydown',e=>{if(screen!=='mul-screen'||!$('pause-dialog').hidden||['SELECT','BUTTON'].includes(e.target.tagName))return;if(/^\d$/.test(e.key))mulInput(Number(e.key));else if(['Backspace','Delete'].includes(e.key)){e.preventDefault();mulInput(null)}});

applyOptions();show('home');
